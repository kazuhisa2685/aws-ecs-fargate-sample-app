name: Push Docker Image to ECR & Deploy to ECS

on:
  push:
    branches:
      - develop

jobs:
  push-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Short SHA
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # バックエンドPUSH
      - name: Build and Push Backend Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: sample-dev-backend
          IMAGE_TAG: ${{ env.SHORT_SHA }}
        run: |
          docker build -f docker/sample-dev-backend/dockerfile -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./docker/sample-dev-backend
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # フロントエンドPUSH
      - name: Build and Push Frontend Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: sample-dev-frontend
          IMAGE_TAG: ${{ env.SHORT_SHA }}
        run: |
          docker build -f docker/sample-dev-frontend/dockerfile -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./docker/sample-dev-frontend
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # ----------------------------------------------------
      # バックエンドのデプロイ (AWS CLI)
      # ----------------------------------------------------
      - name: Deploy Backend to ECS
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TASK_DEF_NAME: sample-dev-backend
          CLUSTER_NAME: sample-dev-cluster
          SERVICE_NAME: sample-dev-backend-service
          CONTAINER_NAME: main
        run: |
          # 1. 稼働中の最新タスク定義を取得
          aws ecs describe-task-definition --task-definition $TASK_DEF_NAME --query taskDefinition > task-def.json

          # 2. イメージを新しいコミットハッシュタグに置き換えて無駄なフィールドを削除
          jq --arg IMAGE "$ECR_REGISTRY/sample-dev-backend:${{ env.SHORT_SHA }}" \
             --arg CONTAINER "$CONTAINER_NAME" \
             '(.containerDefinitions[] | select(.name == $CONTAINER).image) = $IMAGE | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
             task-def.json > new-task-def.json

          # 3. 新しいタスク定義のリビジョンを登録
          NEW_TASK_ARN=$(aws ecs register-task-definition --cli-input-json file://new-task-def.json --query 'taskDefinition.taskDefinitionArn' --output text)

          # 4. ECSサービスを更新してデプロイ
          aws ecs update-service --cluster $CLUSTER_NAME --service $SERVICE_NAME --task-definition $NEW_TASK_ARN

      # ----------------------------------------------------
      # フロントエンドのデプロイ (AWS CLI)
      # ----------------------------------------------------
      - name: Deploy Frontend to ECS
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TASK_DEF_NAME: sample-dev-frontend
          CLUSTER_NAME: sample-dev-cluster
          SERVICE_NAME: sample-dev-frontend-service
          CONTAINER_NAME: app
        run: |
          aws ecs describe-task-definition --task-definition $TASK_DEF_NAME --query taskDefinition > task-def-fe.json

          jq --arg IMAGE "$ECR_REGISTRY/sample-dev-frontend:${{ env.SHORT_SHA }}" \
             --arg CONTAINER "$CONTAINER_NAME" \
             '(.containerDefinitions[] | select(.name == $CONTAINER).image) = $IMAGE | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
             task-def-fe.json > new-task-def-fe.json

          NEW_TASK_ARN=$(aws ecs register-task-definition --cli-input-json file://new-task-def-fe.json --query 'taskDefinition.taskDefinitionArn' --output text)

          aws ecs update-service --cluster $CLUSTER_NAME --service $SERVICE_NAME --task-definition $NEW_TASK_ARN