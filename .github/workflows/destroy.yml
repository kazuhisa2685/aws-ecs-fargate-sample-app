name: destroy-infra-and-services

on:
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-1

permissions:
  id-token: write
  contents: read

jobs:
  destroy-infra-and-services:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Short SHA
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: configure aws credential
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_ARN }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # -----------------------------------------------------------------
      # 1. 構文チェック & 初期化
      # -----------------------------------------------------------------
      - name: Terraform Init & Validate
        working-directory: environments/dev
        run: |
          terraform init
          terraform validate

      # -----------------------------------------------------------------
      # 2. ECSサービスおよび残りすべてのインフラ（Cluster等）を削除
      # -----------------------------------------------------------------
      - name: Destroy Base Infrastructure
        working-directory: environments/dev
        run: |
          # 環境に存在するすべてのリソースを削除する。
          # まずはECSのサービスを削除する。
          for i in {1..3}; do
            terraform destroy -auto-approve \
              -target=module.ecs
              if [ $? -eq 0 ]; then
                break
              fi
          done
          
          # その後、残りのリソースを削除する。回数は3回に分けて実行する。理由は、ECSサービス削除後にALBのターゲットグループが残っている場合があり、削除に失敗するため。
          for i in {1..3}; do
            terraform destroy -auto-approve
            if [ $? -eq 0 ]; then
              break
            fi
          done