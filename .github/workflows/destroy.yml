name: destroy-infra-and-services

on:
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-1

permissions:
  id-token: write
  contents: read

jobs:
  destroy-infra-and-services:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Short SHA
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: configure aws credential
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_ARN }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # -----------------------------------------------------------------
      # 1. 構文チェック & 初期化
      # -----------------------------------------------------------------
      - name: Terraform Init & Validate
        working-directory: environments/dev
        run: |
          terraform init
          terraform validate

      # -----------------------------------------------------------------
      # 2. ECSサービスおよび残りすべてのインフラ（Cluster等）を削除
      # -----------------------------------------------------------------
      - name: Destroy Base Infrastructure
        working-directory: environments/dev
        run: |
          # 引数のコマンドを最大3回リトライする。全部失敗したら非0を返す。
          retry() {
            local max=3
            local wait_sec=30
            for i in $(seq 1 "$max"); do
              echo "::group::attempt $i/$max: $*"
              if "$@"; then
                return 0
              fi
              echo "attempt $i/$max failed"
              if [ "$i" -lt "$max" ]; then
                sleep "$wait_sec"
              fi
            done
            return 1
          }

          # 1. まずECSを削除（サービス削除後にTGが残って失敗することがあるためリトライ）
          retry terraform destroy -auto-approve -target=module.ecs

          # 2. 残りのリソースを削除
          retry terraform destroy -auto-approve