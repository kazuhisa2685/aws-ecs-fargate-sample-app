name: Deploy Infrastructure

on:
  workflow_dispatch:   # pushトリガーを廃止し、手動実行＋Environment保護（要承認）に変更
    inputs: { confirm: { description: "deploy-all", required: true } }

env:
  AWS_REGION: ap-northeast-1

permissions:
  id-token: write
  contents: read

jobs:
  deploy-infra:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Short SHA
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: configure aws credential
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_ARN }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # -----------------------------------------------------------------
      # 1. 構文チェック & 初期化
      # -----------------------------------------------------------------
      - name: Terraform Init & Validate
        working-directory: environments/dev
        run: |
          terraform init
          terraform validate

      # -----------------------------------------------------------------
      # 2. ECS以外の基礎インフラをデプロイ
      # -----------------------------------------------------------------
      - name: Deploy Base Infrastructure (VPC, IAM, ALB, ECR, AURORA, EC2)
        working-directory: environments/dev
        run: |
          terraform apply -auto-approve \
            -target=module.vpc \
            -target=module.iam \
            -target=module.alb \
            -target=module.ecr \
            -target=module.aurora \
            -target=module.ec2 \
            -target=module.lambda \
            -target=module.cloudwatch \
            -target=module.sns            
