name: Deploy Infrastructure and ECS Services with Docker Images

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'デプロイ対象の環境を選択してください (dev / stg / prd)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - stg
          - prd

env:
  AWS_REGION: ap-northeast-1
  ENV: ${{ inputs.environment }}

permissions:
  id-token: write
  contents: read

jobs:
  deploy-infra-and-services-with-docker-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Short SHA
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: configure aws credential
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_ARN }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # -----------------------------------------------------------------
      # 1. 構文チェック & 初期化
      # -----------------------------------------------------------------
      - name: Terraform Init & Validate
        working-directory: environments/${{ env.ENV }}
        run: |
          terraform init
          terraform validate

      # -----------------------------------------------------------------
      # 2. ECS以外の基礎インフラ（VPC, IAM, ALB, ECR等）を先行デプロイ
      # -----------------------------------------------------------------
      - name: Deploy Base Infrastructure (VPC, IAM, ALB, ECR)
        working-directory: environments/${{ env.ENV }}
        run: |
          terraform apply -auto-approve \
            -target=module.vpc \
            -target=module.iam \
            -target=module.alb \
            -target=module.ecr \
            -target=module.aurora \
            -target=module.ec2

      # -----------------------------------------------------------------
      # 3. ECRログイン & Dockerイメージの Build / Push
      # -----------------------------------------------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Backend Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: sample-${{ env.ENV }}-backend
          IMAGE_TAG: ${{ env.SHORT_SHA }}
        run: |
          docker build -f docker/sample-${{ env.ENV }}-backend/dockerfile -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./docker/sample-${{ env.ENV }}-backend
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Build and Push Frontend Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: sample-${{ env.ENV }}-frontend
          IMAGE_TAG: ${{ env.SHORT_SHA }}
        run: |
          docker build -f docker/sample-${{ env.ENV }}-frontend/dockerfile -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./docker/sample-${{ env.ENV }}-frontend
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # -----------------------------------------------------------------
      # 4. タスク定義を更新
      # -----------------------------------------------------------------
      - name: Deploy Task Definitions
        working-directory: environments/${{ env.ENV }}
        run: |
          terraform apply -auto-approve \
            -var="backend_image_tag=${{ env.SHORT_SHA }}" \
            -var="frontend_image_tag=${{ env.SHORT_SHA }}" \
            -target=module.ecs.aws_ecs_task_definition.ecs_backend_taskdef \
            -target=module.ecs.aws_ecs_task_definition.ecs_frontend_taskdef

      # -----------------------------------------------------------------
      # 5. バックエンドECSサービスを先行デプロイ
      # -----------------------------------------------------------------
      - name: Deploy Backend ECS Service
        working-directory: environments/${{ env.ENV }}
        run: |
          terraform apply -auto-approve \
            -var="backend_image_tag=${{ env.SHORT_SHA }}" \
            -var="frontend_image_tag=${{ env.SHORT_SHA }}" \
            -target=module.ecs.aws_ecs_service.ecs_backend_service

      # -----------------------------------------------------------------
      # バックエンドサービスが安定状態になるまで待機
      # -----------------------------------------------------------------
      - name: Wait for Backend ECS Service to become Stable
        run: |
          aws ecs wait services-stable \
            --cluster sample-${{ env.ENV }}-cluster \
            --services sample-${{ env.ENV }}-backend-service \
            --region ${{ env.AWS_REGION }}

      # -----------------------------------------------------------------
      # 6. フロントエンドおよび残りすべてのインフラをデプロイ
      # -----------------------------------------------------------------
      - name: Deploy Frontend ECS Service & Entire Infrastructure
        working-directory: environments/${{ env.ENV }}
        run: |
          terraform apply -auto-approve \
            -var="backend_image_tag=${{ env.SHORT_SHA }}" \
            -var="frontend_image_tag=${{ env.SHORT_SHA }}"

      # -----------------------------------------------------------------
      # 7. 監視機能
      # -----------------------------------------------------------------
      - name: Deploy Monitoring
        working-directory: environments/${{ env.ENV }}
        run: |
          terraform apply -auto-approve \
            -target=module.lambda \
            -target=module.cloudwatch \
            -target=module.sns