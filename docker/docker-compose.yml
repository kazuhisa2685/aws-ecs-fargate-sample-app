version: "3.9"

# ローカル動作確認用。本番はAurora/ECS/ALB/Fargateへ置き換える。
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sampledb
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./sample-dev-backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: sampledb
      FRONTEND_ORIGIN: "*"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./sample-dev-frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "1500:1500"
    depends_on:
      - backend

volumes:
  db_data:
